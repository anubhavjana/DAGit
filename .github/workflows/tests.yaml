name: tests

on:
  pull_request:
    branches: [anubhav]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: changes
  #
  # Runs on every PR. Uses gh CLI to fetch the full list of changed files
  # and checks if any file outside tests/docs/ or docs/ was modified.
  #
  # This avoids dorny/paths-filter negation limitations entirely.
  #
  # has_other=true  -> non-doc files changed -> run tests
  # has_other=false -> only doc files changed -> skip tests
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      has_other: ${{ steps.filter.outputs.has_other }}
    steps:
      - name: Check which paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch all files changed in this PR
          FILES=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json files --jq '.files[].path')

          echo "Changed files:"
          echo "$FILES"

          # Check if any changed file is outside doc directories
          NON_DOC=$(echo "$FILES" | grep -v '^tests/docs/' | grep -v '^docs/' || true)

          if [[ -z "$NON_DOC" ]]; then
            echo "Only doc files changed — skipping tests."
            echo "has_other=false" >> "$GITHUB_OUTPUT"
          else
            echo "Non-doc files changed — running tests."
            echo "has_other=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: dummy test matrix
  #
  # Simulates the real test matrix. Only runs when has_other=true.
  # Skipped entirely for doc-only PRs.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.suite.name }}
    needs: changes
    if: needs.changes.outputs.has_other == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Dummy Test Suite A
          - name: Dummy Test Suite B
    steps:
      - name: Run dummy test
        run: |
          echo "Running ${{ matrix.suite.name }}..."
          echo "Tests passed."

  # ---------------------------------------------------------------------------
  # Job 3: required check gate
  #
  # Always reports a status so branch protection never gets stuck.
  #
  #   test result = success -> tests ran and passed    -> green
  #   test result = skipped -> docs-only change        -> green (instant)
  #   test result = failure -> tests failed            -> red (blocks merge)
  # ---------------------------------------------------------------------------
  run-spyre-unit-tests:
    name: Run Spyre unit tests
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Evaluate test results
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          echo "Test job result: ${TEST_RESULT}"

          if [[ "${TEST_RESULT}" == "success" ]]; then
            echo "All test suites passed."
            exit 0
          fi

          if [[ "${TEST_RESULT}" == "skipped" ]]; then
            echo "Tests skipped — docs-only change."
            exit 0
          fi

          echo "One or more test suites failed or were cancelled."
          exit 1